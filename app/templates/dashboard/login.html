<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Health is First</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card {
            background: #16213e; border-radius: 20px; padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.06); max-width: 420px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .form-control {
            background: #0f3460 !important; border: 1px solid rgba(255,255,255,0.1) !important;
            color: #fff !important; border-radius: 10px; padding: 12px 16px;
        }
        .form-control:focus { border-color: #e94560 !important; box-shadow: 0 0 0 3px rgba(233,69,96,0.15) !important; }
        .btn-login { background: #e94560; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 1rem; }
        .btn-login:hover { background: #c1121f; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div style="font-size: 3rem;">💚</div>
            <h3 style="color: #fff; font-weight: 900;">Health is First</h3>
            <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">نظام إدارة المحتوى الصحي</p>
        </div>

        {% if error %}
        <div class="alert" style="background:rgba(230,57,70,0.15);color:#e63946;border-radius:10px;border:none;font-size:0.9rem;">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/dashboard/login">
            <div class="mb-3">
                <label style="color:rgba(255,255,255,0.6);font-size:0.85rem;margin-bottom:6px;display:block;">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" placeholder="admin@health.com" required>
            </div>
            <div class="mb-4">
                <label style="color:rgba(255,255,255,0.6);font-size:0.85rem;margin-bottom:6px;display:block;">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login w-100 text-white">
                دخول إلى لوحة التحكم
            </button>
        </form>

        <div class="text-center mt-4" style="color:rgba(255,255,255,0.3);font-size:0.75rem;">
            نظام آمن | Powered by Gemini AI & FastAPI
        </div>
    </div>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</body>
</html>
